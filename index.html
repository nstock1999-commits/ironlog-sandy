<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IRONLOG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#160f1e">
<title>IRONLOG — Sandy</title>
<style>
  :root{
    --bg:#160f1e;
    --surface:#20152c;
    --surface-2:#2a1c39;
    --steel:#4a3160;
    --steel-lt:#6b4a8a;
    --chalk:#f4eef9;
    --chalk-dim:#b79bcf;
    --blue:#e05fd0;
    --blue-dim:#5c1f47;
    --pr:#ff6ec7;
    --pr-dim:#4a0f1a;
    --accent:#a06bff;
    --radius:10px;
    font-size:16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 10% 0%, #1a0a0a 0%, var(--bg) 45%),
      radial-gradient(circle at 90% 10%, rgba(224,95,208,0.12) 0%, transparent 40%),
      var(--bg);
    color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:64px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  header{
    padding:26px 18px 18px;
    border-bottom:1px solid var(--steel);
    position:sticky; top:0; z-index:10;
    background:rgba(22,15,30,0.92);
    backdrop-filter:blur(6px);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  h1{
    margin:0;
    font-size:1.6rem;
    letter-spacing:0.14em;
    font-weight:800;
    text-transform:uppercase;
    background:linear-gradient(90deg, var(--blue), var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tagline{ margin:4px 0 0; font-size:0.78rem; color:var(--chalk-dim); letter-spacing:0.04em; }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:14px; }
  .owner-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--steel);
    border-radius:999px; padding:6px 14px;
    font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--blue);
  }

  .tabs-container{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:12px 14px 0;
    border-bottom:1px solid var(--steel);
    background:rgba(22,15,30,0.5);
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
  }
  .tab-btn{
    flex:0 0 auto;
    background:transparent;
    color:var(--chalk-dim);
    border:none;
    border-bottom:2px solid transparent;
    padding:10px 14px;
    font-size:0.85rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:color .2s, border-color .2s;
    white-space:nowrap;
  }
  .tab-btn:hover{ color:var(--chalk); }
  .tab-btn.active{
    color:var(--blue);
    border-bottom-color:var(--blue);
  }

  main{ max-width:640px; margin:0 auto; padding:18px 14px 0; }

  .add-exercise{ display:flex; gap:8px; margin-bottom:22px; }
  input[type=text], input[type=number]{
    background:var(--surface-2);
    border:1px solid var(--steel);
    color:var(--chalk);
    border-radius:8px;
    padding:12px 12px;
    font-size:1rem;
    width:100%;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, input[type=number]:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-dim);
  }
  .add-exercise input{ flex:1; }
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px;
    font-weight:700; letter-spacing:0.03em;
  }
  .btn-primary{
    background:linear-gradient(90deg, var(--blue), var(--accent));
    color:#fff; padding:0 18px; font-size:0.95rem; text-transform:uppercase; white-space:nowrap;
  }
  .btn-primary:active{ transform:scale(0.97); }
  .btn-ghost{
    background:transparent; color:var(--chalk-dim); border:1px solid var(--steel);
    padding:9px 14px; font-size:0.82rem;
  }
  .btn-ghost:active{ transform:scale(0.97); }
  .btn-danger{ color:var(--pr); }

  .empty{
    text-align:center; color:var(--chalk-dim); padding:60px 20px;
    border:1px dashed var(--steel); border-radius:var(--radius); font-size:0.95rem; line-height:1.6;
  }
  .empty strong{ color:var(--chalk); display:block; margin-bottom:6px; font-size:1.05rem; }

  .exercise{
    background:var(--surface); border:1px solid var(--steel); border-radius:var(--radius);
    margin-bottom:16px; overflow:hidden;
  }
  .exercise-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 14px 12px; gap:10px; }
  .exercise-name{ font-size:1.05rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; word-break:break-word; }
  .exercise-target{ font-size:0.68rem; color:var(--chalk-dim); font-weight:500; text-transform:none; letter-spacing:0; margin-top:2px; }
  .plate{
    flex:none; width:52px; height:52px; border-radius:50%; border:3px solid var(--steel-lt);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; line-height:1; background:var(--surface-2);
  }
  .plate .num{ font-size:0.95rem; font-weight:700; }
  .plate .lbl{ font-size:0.5rem; color:var(--chalk-dim); letter-spacing:0.05em; margin-top:2px; }
  .plate.is-pr{ border-color:var(--pr); animation:pulse 1.6s ease-out 1; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(196,30,58,0.55); }
    100%{ box-shadow:0 0 0 14px rgba(196,30,58,0); }
  }

  .exercise-head-left{ display:flex; align-items:center; gap:12px; min-width:0; }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--chalk-dim); text-align:center; padding:0 4px 8px; font-weight:600;
  }
  thead th:first-child{ text-align:left; padding-left:14px; }
  tbody td{ padding:6px 4px; text-align:center; }
  tbody td:first-child{ padding-left:14px; text-align:left; }
  tbody tr{ border-top:1px solid var(--steel); }
  .set-num{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--chalk-dim); font-size:0.85rem; }
  .cell-input{
    width:100%; max-width:64px; padding:8px 4px; text-align:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:0.95rem;
  }
  .rm-cell{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--chalk-dim); font-size:0.82rem; }
  .del-set{ background:transparent; color:var(--chalk-dim); border:none; font-size:1rem; padding:4px 8px; line-height:1; }
  .del-set:active{ color:var(--pr); }

  .predict-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:10px 14px 14px; padding:10px 12px;
    background:var(--surface-2); border:1px solid var(--steel); border-radius:8px;
  }
  .predict-label{ font-size:0.72rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.05em; }
  .predict-value{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:1.15rem; font-weight:700; color:var(--blue); }
  .predict-note{ font-size:0.68rem; color:var(--chalk-dim); margin-top:2px; }

  .exercise-actions{ display:flex; gap:8px; padding:0 14px 14px; flex-wrap:wrap; }
  .exercise-actions .btn-ghost{ flex:1; text-align:center; min-width:120px; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:linear-gradient(90deg, var(--blue), var(--accent));
    color:#fff; font-weight:700; font-size:0.85rem;
    padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .tab-btn{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tab-focus{
    font-size:0.58rem; font-weight:600; letter-spacing:0.09em;
    text-transform:uppercase; opacity:0.65;
  }

  .partner-toggle{
    background:transparent; color:var(--chalk-dim); border:1px solid var(--steel);
    border-radius:999px; padding:7px 14px; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap;
    transition:color .15s, border-color .15s, background .15s;
  }
  .partner-toggle:active{ transform:scale(0.97); }
  .partner-toggle.is-active{ color:#fff; border-color:var(--accent); background:var(--blue-dim); }

  .partner-banner{
    margin:0 0 16px; padding:10px 12px;
    background:var(--surface-2); border:1px solid var(--steel);
    border-left:3px solid var(--accent); border-radius:8px;
    font-size:0.76rem; color:var(--chalk-dim); line-height:1.5;
  }
  .partner-banner strong{
    color:var(--chalk); text-transform:uppercase; letter-spacing:0.05em; font-size:0.7rem;
  }

  .cell-input:disabled{
    background:transparent; border-color:transparent;
    color:var(--chalk-dim); opacity:1; -webkit-text-fill-color:var(--chalk-dim);
  }

  /* ---------- mode switch ---------- */
  .mode-tabs{
    display:flex; gap:6px; padding:12px 14px 0; max-width:640px; margin:0 auto;
  }
  .mode-tab{
    flex:1; background:var(--surface-2); color:var(--chalk-dim);
    border:1px solid var(--steel); border-radius:8px; padding:10px 12px;
    font-size:0.82rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
  }
  .mode-tab.active{
    background:linear-gradient(90deg, var(--blue), var(--accent));
    color:#fff; border-color:transparent;
  }

  /* ---------- nutrition ---------- */
  .date-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--steel);
    border-radius:var(--radius); padding:8px 10px; margin-bottom:16px;
  }
  .date-step{
    background:var(--surface-2); color:var(--chalk); border:1px solid var(--steel);
    border-radius:8px; padding:8px 16px; font-size:1rem; line-height:1;
  }
  .date-label{ text-align:center; flex:1; }
  .date-label .d-main{ font-weight:700; font-size:0.95rem; letter-spacing:0.03em; }
  .date-label .d-sub{ font-size:0.68rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.06em; }

  .macro-card{
    background:var(--surface); border:1px solid var(--steel);
    border-radius:var(--radius); padding:14px; margin-bottom:16px;
  }
  .macro-row{ margin-bottom:14px; }
  .macro-row:last-child{ margin-bottom:0; }
  .macro-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px; }
  .macro-name{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--chalk-dim); font-weight:600; }
  .macro-val{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:0.85rem; font-variant-numeric:tabular-nums; }
  .macro-val b{ font-size:1rem; color:var(--chalk); }
  .macro-track{ height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; position:relative; }
  .macro-fill{ height:100%; border-radius:999px; transition:width .25s ease; }
  .macro-fill.under{ background:var(--steel-lt); }
  .macro-fill.good{ background:#3f8f5a; }
  .macro-fill.over{ background:var(--pr); }
  .macro-zone{
    position:absolute; top:0; bottom:0; border-left:1px dashed var(--chalk-dim);
    opacity:.55; pointer-events:none;
  }
  .macro-note{ font-size:0.66rem; color:var(--chalk-dim); margin-top:4px; letter-spacing:0.02em; }

  .nut-form{
    background:var(--surface); border:1px solid var(--steel);
    border-radius:var(--radius); padding:14px; margin-bottom:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .nut-form .row{ display:flex; gap:8px; }
  .nut-form .row > *{ flex:1; min-width:0; }
  .nut-form label{
    display:block; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--chalk-dim); margin-bottom:4px; font-weight:600;
  }
  .nut-form select, .nut-form input[type=time]{
    background:var(--surface-2); border:1px solid var(--steel); color:var(--chalk);
    border-radius:8px; padding:11px 10px; font-size:0.95rem; width:100%;
    font-family:inherit; outline:none;
  }
  .nut-form select:focus, .nut-form input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-dim); }
  .cal-hint{ font-size:0.64rem; color:var(--chalk-dim); margin-top:4px; }

  .meal-group{ margin-bottom:14px; }
  .meal-title{
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--accent); font-weight:700; margin-bottom:6px;
  }
  .entry{
    background:var(--surface); border:1px solid var(--steel); border-radius:8px;
    padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start;
  }
  .entry-main{ flex:1; min-width:0; }
  .entry-food{ font-size:0.92rem; word-break:break-word; }
  .entry-meta{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:0.72rem; color:var(--chalk-dim); margin-top:3px; font-variant-numeric:tabular-nums;
  }
  .entry-cal{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:0.95rem; font-weight:700; color:var(--blue); white-space:nowrap;
  }
  .entry-del{ background:transparent; border:none; color:var(--chalk-dim); font-size:1rem; padding:2px 4px; line-height:1; }
  .entry-del:active{ color:var(--pr); }

  .targets-toggle{
    background:transparent; border:1px solid var(--steel); color:var(--chalk-dim);
    border-radius:8px; padding:9px 12px; font-size:0.74rem; width:100%;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .targets-form{
    background:var(--surface); border:1px solid var(--steel); border-radius:var(--radius);
    padding:14px; margin-top:10px; display:flex; flex-direction:column; gap:10px;
  }

  .reminders{
    background:var(--surface); border:1px solid var(--steel);
    border-radius:var(--radius); padding:14px; margin-top:16px;
    display:flex; flex-direction:column; gap:12px;
  }
  .reminders h3{
    margin:0; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--accent); font-weight:700;
  }
  .rem-block{ display:flex; flex-direction:column; gap:9px; }
  .rem-block + .rem-block{ border-top:1px solid var(--steel); padding-top:12px; }
  .rem-status{ font-size:0.74rem; color:var(--chalk-dim); line-height:1.5; }
  .rem-status.bad{ color:var(--pr); }
  .rem-status.good{ color:#7fd6a0; }
  .rem-row{ display:flex; gap:8px; }
  .rem-row > div{ flex:1; min-width:0; }
  .rem-row label{
    display:block; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--chalk-dim); margin-bottom:4px; font-weight:600;
  }
  .rem-row input, .rem-row select{
    background:var(--surface-2); border:1px solid var(--steel); color:var(--chalk);
    border-radius:8px; padding:11px 8px; font-size:0.95rem; width:100%;
    font-family:inherit; outline:none;
  }
  .rem-row input:focus, .rem-row select:focus{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-dim); }
  .rem-note{ font-size:0.66rem; color:var(--chalk-dim); line-height:1.5; }

  footer{ text-align:center; color:var(--steel-lt); font-size:0.7rem; padding:26px 14px 10px; letter-spacing:0.04em; }
</style>
</head>
<body>

<header>
  <div class="brand"><h1>IRON<span></span>LOG</h1></div>
  <p class="tagline">DAPRE Protocol • Upper / Lower / Push / Pull / Legs</p>
  <div class="header-row">
    <div class="owner-badge">Sandy's Log</div>
  </div>
</header>

<div class="mode-tabs" id="modeTabs">
  <button class="mode-tab active" data-mode="lifting" type="button">Lifting</button>
  <button class="mode-tab" data-mode="nutrition" type="button">Nutrition</button>
</div>

<div class="tabs-container" id="tabsContainer"></div>

<main>
  <div id="liftingPanel">
    <div class="add-exercise">
      <input type="text" id="newExerciseInput" placeholder="Exercise name (e.g. Squat)" autocomplete="off">
      <button class="btn-primary" id="addExerciseBtn">Add</button>
    </div>

    <div id="exerciseList"></div>
  </div>
  <div id="nutritionPanel" hidden>
    <div class="date-nav">
      <button class="date-step" id="nutPrev" type="button" aria-label="Previous day">&lsaquo;</button>
      <div class="date-label"><div class="d-main" id="nutDateMain"></div><div class="d-sub" id="nutDateSub"></div></div>
      <button class="date-step" id="nutNext" type="button" aria-label="Next day">&rsaquo;</button>
    </div>

    <div class="macro-card" id="nutSummary"></div>

    <form class="nut-form" id="nutForm">
      <div class="row">
        <div>
          <label for="nutMeal">Meal</label>
          <select id="nutMeal">
            <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option>
          </select>
        </div>
        <div>
          <label for="nutTime">Time</label>
          <input type="time" id="nutTime">
        </div>
      </div>
      <div>
        <label for="nutFood">Food</label>
        <input type="text" id="nutFood" placeholder="e.g. 8 oz chicken thighs + rice" autocomplete="off">
      </div>
      <div class="row">
        <div><label for="nutProtein">Protein (g)</label><input type="number" id="nutProtein" inputmode="decimal" min="0" step="1"></div>
        <div><label for="nutCarbs">Carbs (g)</label><input type="number" id="nutCarbs" inputmode="decimal" min="0" step="1"></div>
        <div><label for="nutFat">Fat (g)</label><input type="number" id="nutFat" inputmode="decimal" min="0" step="1"></div>
      </div>
      <div>
        <label for="nutCalories">Calories</label>
        <input type="number" id="nutCalories" inputmode="numeric" min="0" step="1">
        <div class="cal-hint" id="nutCalHint">Auto from macros. Type here to override.</div>
      </div>
      <button class="btn-primary" id="nutAdd" type="submit" style="padding:13px">Add Entry</button>
    </form>

    <div id="nutEntries"></div>

    <button class="targets-toggle" id="nutTargetsToggle" type="button">Edit daily targets</button>
    <div class="targets-form" id="nutTargetsForm" hidden></div>

    <div class="reminders" id="reminders">
      <div class="rem-block" id="remMeals">
        <h3>Meal Reminders</h3>
        <div class="rem-status" id="remMealStatus">Checking&hellip;</div>
        <div class="rem-row">
          <div><label for="remT0">Breakfast</label><input type="time" id="remT0" value="08:00"></div>
          <div><label for="remT1">Lunch</label><input type="time" id="remT1" value="12:30"></div>
          <div><label for="remT2">Dinner</label><input type="time" id="remT2" value="18:30"></div>
        </div>
        <button class="btn-primary" id="remMealOn" type="button" style="padding:13px">Turn On Meal Reminders</button>
        <button class="btn-ghost" id="remMealOff" type="button" hidden>Turn Off Meal Reminders</button>
      </div>
      <div class="rem-block" id="remScan">
        <h3>Body Comp Scan</h3>
        <div class="rem-status" id="remScanStatus">Checking&hellip;</div>
        <div class="rem-row">
          <div><label for="remScanDate">Next scan</label><input type="date" id="remScanDate" value="2026-09-14"></div>
          <div><label for="remScanTime">Time</label><input type="time" id="remScanTime" value="07:30"></div>
        </div>
        <div class="rem-row">
          <div><label for="remScanEvery">Repeat</label>
            <select id="remScanEvery">
              <option value="28">Every 4 weeks</option>
              <option value="35" selected>Every 5 weeks (deload weeks)</option>
              <option value="42">Every 6 weeks</option>
              <option value="56">Every 8 weeks</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" id="remScanOn" type="button" style="padding:13px">Turn On Scan Reminder</button>
        <button class="btn-ghost" id="remScanOff" type="button" hidden>Turn Off Scan Reminder</button>
      </div>
      <div class="rem-note" id="remNote"></div>
    </div>

  </div>
</main>

<footer>DAPRE progression. Saved on your device, backed up to the cloud. Log it. Lift it. Beat it next time.</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PERSON = "sandy";
  var STORAGE_KEY = "ironlog_data_sandy_v1";
  var SYNC_URL = "/api/sync?person=" + PERSON;
  var PARTNER = null;
  var NUTRITION = true;

  var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];

  var DEFAULT_TARGETS = {
    caloriesMin: 2300, caloriesMax: 2450,
    proteinMin: 175,   proteinMax: 175,
    carbsMin: 215,     carbsMax: 235,
    fatMin: 65,        fatMax: 75
  };

  var TARGET_FIELDS = [
    { key: "calories", label: "Calories" },
    { key: "protein",  label: "Protein (g)" },
    { key: "carbs",    label: "Carbs (g)" },
    { key: "fat",      label: "Fat (g)" }
  ];

  var MAX_HISTORY = 24;

  var SEED_DAYS = [
    { dayName: "Monday", label: "Mon", focus: "Legs", exercises: [
      { name: "Smith Machine Squat", target: "4 \u00d7 8-10", sets: 4 },
      { name: "Hip Thrust", target: "4 \u00d7 10-12", sets: 4 },
      { name: "Leg Press", target: "4 \u00d7 12-15", sets: 4 },
      { name: "Leg Curl", target: "3 \u00d7 12-15", sets: 3 },
      { name: "Calf Raise", target: "3 \u00d7 15-20", sets: 3 }
    ]},
    { dayName: "Tuesday", label: "Tue", focus: "Chest & Calves", exercises: [
      { name: "Smith Machine Bench Press", target: "3 \u00d7 10-12", sets: 3 },
      { name: "Incline Dumbbell Press", target: "3 \u00d7 10-12", sets: 3 },
      { name: "Cable Fly / Pec Deck", target: "2 \u00d7 12-15", sets: 2 },
      { name: "Dips", target: "2 \u00d7 10-12", sets: 2 },

    ]},
    { dayName: "Wednesday", label: "Wed", focus: "Shoulders", exercises: [
      { name: "Smith Machine OHP", target: "3 \u00d7 10-12", sets: 3 },
      { name: "Lateral Raise", target: "3 \u00d7 12-15", sets: 3 },
      { name: "Rear Delt Fly", target: "2 \u00d7 12-15", sets: 2 },
      { name: "Front Raise", target: "2 \u00d7 12-15", sets: 2 }
    ]},
    { dayName: "Thursday", label: "Thu", focus: "Back & Glutes", exercises: [
      { name: "Lat Pulldown", target: "3 \u00d7 10-12", sets: 3 },
      { name: "Seated Cable Row", target: "3 \u00d7 10-12", sets: 3 },
      { name: "Romanian Deadlift", target: "4 \u00d7 10-12", sets: 4 },
      { name: "Cable Pull-Through", target: "3 \u00d7 12-15", sets: 3 }
    ]},
    { dayName: "Friday", label: "Fri", focus: "Arms & Glutes", exercises: [
      { name: "Barbell/EZ-Bar Curl", target: "2 \u00d7 10-12", sets: 2 },
      { name: "Close-Grip Bench Press", target: "2 \u00d7 10-12", sets: 2 },
      { name: "Bulgarian Split Squat", target: "4 \u00d7 10-12/leg", sets: 4 },
      { name: "Abductor Machine", target: "3 \u00d7 15-20", sets: 3 }
    ]}
  ];

  // Bumped whenever the seeded program changes, so an existing log is
  // reconciled onto the new plan instead of being left on the old one.
  var PROGRAM_VERSION = 3;

  /* ------------------------------------------------------------------ */
  /* dates                                                              */
  /* ------------------------------------------------------------------ */

  function dateKey(d){
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }

  function todayKey(){
    return dateKey(new Date());
  }

  function prettyDate(key){
    if(!key) return "";
    var parts = String(key).split("-");
    if(parts.length !== 3) return String(key);
    return parts[1].replace(/^0/, "") + "/" + parts[2].replace(/^0/, "");
  }

  /* ------------------------------------------------------------------ */
  /* math: 1RM + DAPRE                                                  */
  /* ------------------------------------------------------------------ */

  function epley1RM(weight, reps){
    if(!weight || !reps) return 0;
    return weight * (1 + reps / 30);
  }

  function bestE1RM(sets){
    var best = 0;
    for(var i=0;i<sets.length;i++){
      var e = epley1RM(sets[i].weight, sets[i].reps);
      if(e > best) best = e;
    }
    return best;
  }

  // Planet Fitness plate math: every suggested weight lands on a 5 lb increment.
  // This is the ONLY rounding helper — nothing else may round a weight.
  function round5(n){
    if(typeof n !== "number" || !isFinite(n)) return null;
    return Math.max(0, Math.round(n / 5) * 5);
  }

  function dapreDelta(reps){
    if(reps === null || reps === undefined || isNaN(reps)) return null;
    if(reps >= 16) return 10;
    if(reps === 15) return 7.5;
    if(reps >= 13) return 5;     // 13-14
    if(reps >= 10) return 2.5;   // 10-12
    if(reps >= 8) return 0;      // 8-9 hold
    if(reps >= 6) return -2.5;   // 6-7
    return -5;                   // <= 5
  }

  // A single 5 lb plate is ~2% of a squat but ~25% of a 20 lb lateral raise.
  // Flat 5 lb jumps overshoot the rep target on light movements, so no single
  // increase may exceed this fraction of the current load.
  var MAX_INCREASE_PCT = 0.10;

  // Reps that earn the smallest real step (5 lb) on a light lift -- i.e. top
  // of the working range. Below this, a capped lift holds instead.
  var EARN_STEP_REPS = 13;

  function dapre(weight, reps){
    if(!weight || reps === null || reps === undefined) return null;
    var delta = dapreDelta(reps);
    if(delta === null) return null;

    var current = round5(weight);
    var next = round5(weight + delta);
    if(current === null || next === null) return null;

    if(next > current){
      var ceiling = current * (1 + MAX_INCREASE_PCT);
      if(next > ceiling){
        // 5 lb is the smallest plate we can actually load, so on light lifts
        // hold until the top of the range earns that step (double progression).
        next = reps >= EARN_STEP_REPS ? current + 5 : current;
      }
    }
    return next;
  }

  // True when the percentage cap suppressed an increase, so the UI can explain
  // why the weight is not moving.
  function dapreHeldByCap(weight, reps){
    if(!weight || reps === null || reps === undefined) return false;
    var delta = dapreDelta(reps);
    if(delta === null || delta <= 0) return false;
    var current = round5(weight);
    if(current === null) return false;
    return round5(weight + delta) > current * (1 + MAX_INCREASE_PCT) &&
           reps < EARN_STEP_REPS;
  }

  /* ------------------------------------------------------------------ */
  /* state                                                              */
  /* ------------------------------------------------------------------ */

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function normalizeExercise(ex){
    if(!ex) return ex;
    if(!Array.isArray(ex.sets)) ex.sets = [];
    if(!Array.isArray(ex.history)) ex.history = [];
    if(typeof ex.targetSets !== "number") ex.targetSets = 0;
    return ex;
  }

  function normalizeState(data){
    if(!data || !Array.isArray(data.exercises)) return null;
    data.exercises.forEach(normalizeExercise);
    if(!data.lastActiveDate) data.lastActiveDate = todayKey();
    reconcileProgram(data);
    if(importStartingWeights(data)) programMigrated = true;
    normalizeNutrition(data);
    return data;
  }

  function migrateOldData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(data && data.exercises){
          data.exercises.forEach(function(ex){
            if(!ex.dayName){
              var matchedDay = null;
              SEED_DAYS.forEach(function(day){
                day.exercises.forEach(function(seedEx){
                  if(seedEx.name === ex.name){
                    matchedDay = day.dayName;
                  }
                });
              });
              ex.dayName = matchedDay || SEED_DAYS[0].dayName;
            }
          });
          return data;
        }
      }
    }catch(e){}
    return null;
  }

  function buildSeedState(){
    var exercises = [];
    SEED_DAYS.forEach(function(group){
      group.exercises.forEach(function(ex){
        exercises.push({
          id: uid(),
          name: ex.name,
          dayName: group.dayName,
          target: ex.target,
          targetSets: ex.sets || 0,
          sets: [],
          history: []
        });
      });
    });
    var seeded = { exercises: exercises, lastActiveDate: todayKey(),
                   programVersion: PROGRAM_VERSION };
    importStartingWeights(seeded);
    return normalizeNutrition(seeded);
  }

  // Exercise names carry annotations ("Leg Press (superset -> next)",
  // "Barbell Shrug ss/ Bent Over Row"). Match on the movement itself so a
  // renamed lift keeps the history already logged against it.
  function normalizeName(n){
    return String(n || "")
      .toLowerCase()
      .replace(/\(.*$/, "")
      .replace(/\bss\/.*$/, "")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  // Move an existing log onto the current program. Every logged set and every
  // archived session survives; nothing is deleted.
  // Set when a load migrated the program, so the result gets persisted
  // instead of being silently re-derived on every open.
  var programMigrated = false;

  function reconcileProgram(data){
    if(data.programVersion === PROGRAM_VERSION) return false;

    // Buckets, not single slots: Calf Raise appears on both Monday and Tuesday,
    // so one normalized name can legitimately map to more than one exercise.
    var byName = {};
    data.exercises.forEach(function(ex){
      var k = normalizeName(ex.name);
      (byName[k] = byName[k] || []).push(ex);
    });

    var next = [];
    SEED_DAYS.forEach(function(day){
      day.exercises.forEach(function(seed){
        var k = normalizeName(seed.name);
        var bucket = byName[k];
        var existing = (bucket && bucket.length) ? bucket.shift() : null;
        if(existing){
          existing.name = seed.name;
          existing.dayName = day.dayName;
          existing.target = seed.target;
          existing.targetSets = seed.sets || 0;
          next.push(existing);
        } else {
          next.push({
            id: uid(), name: seed.name, dayName: day.dayName,
            target: seed.target, targetSets: seed.sets || 0,
            sets: [], history: []
          });
        }
      });
    });

    // Lifts the new program dropped, plus anything added by hand: keep them if
    // they hold real work, on whichever day they already lived.
    Object.keys(byName).forEach(function(k){
      byName[k].forEach(function(ex){
        var hasWork = (ex.sets && ex.sets.length) || (ex.history && ex.history.length);
        if(hasWork){ ex.targetSets = 0; next.push(ex); }
      });
    });

    data.exercises = next;
    data.programVersion = PROGRAM_VERSION;
    programMigrated = true;
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* starting weights imported from the tracker sheet                    */
  /* ------------------------------------------------------------------ */

  // Last working set recorded in the "CURRENT WORKOUT PROGRAM" sheet before
  // this app existed, mapped onto the movement that replaced it. Seeded as one
  // prior session so DAPRE and the pre-fill have a real number to start from
  // instead of a blank box.
  var IMPORT_DATE = "2026-08-07";
  var IMPORT_VERSION = 1;
  var IMPORTED_STARTS = {
    "Smith Machine Squat": [
        75,
        10
    ],
    "Leg Press": [
        217,
        10
    ],
    "Smith Machine Bench Press": [
        15,
        10
    ],
    "Smith Machine OHP": [
        45,
        8
    ]
};

  function hasAnyWork(ex){
    if((ex.sets || []).some(isLoggedSet)) return true;
    return (ex.history || []).length > 0;
  }

  function importStartingWeights(data){
    if(data.startsImported >= IMPORT_VERSION) return false;

    data.exercises.forEach(function(ex){
      var seed = IMPORTED_STARTS[ex.name];
      // Never write over something actually logged in the app -- the import is
      // a floor for a cold start, not a source of truth.
      if(!seed || hasAnyWork(ex)) return;
      ex.history.push({
        date: IMPORT_DATE,
        imported: true,
        sets: [{ weight: seed[0], reps: seed[1] }]
      });
    });

    data.startsImported = IMPORT_VERSION;
    return true;
  }

  function load(){
    try{
      return normalizeState(migrateOldData()) || buildSeedState();
    }catch(e){
      return buildSeedState();
    }
  }

  var state = load();
  var currentDayIdx = getTodayIndex();

  function getTodayIndex(){
    var d = new Date();
    var dayOfWeek = d.getDay();
    var mondayIdx = dayOfWeek === 0 ? 4 : dayOfWeek - 1;
    return Math.max(0, Math.min(4, mondayIdx));
  }

  /* ------------------------------------------------------------------ */
  /* persistence: localStorage first, cloud backup after (never blocking) */
  /* ------------------------------------------------------------------ */

  var syncTimer = null;

  function persistLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){}
  }

  function save(){
    // Stamped so another device can tell whose copy is newer.
    state.updatedAt = new Date().toISOString();
    // Local write always happens first and is never gated on the network.
    persistLocal();
    scheduleCloudBackup();
  }

  function scheduleCloudBackup(){
    try{
      if(syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(cloudBackup, 800);
    }catch(e){}
  }

  function cloudBackup(){
    syncTimer = null;
    try{
      if(typeof fetch !== "function") return;
      // An empty log is never worth uploading, and uploading one over a good
      // backup is how a cleared browser becomes permanent data loss. The
      // function refuses these too; this avoids the pointless round trip.
      if(countWork(state) === 0) return;
      var body = JSON.stringify({
        person: PERSON,
        updatedAt: new Date().toISOString(),
        state: state
      });
      var p = fetch(SYNC_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body,
        keepalive: true
      });
      // A failed sync must never surface to the lifter or break local logging.
      if(p && typeof p.catch === "function") p.catch(function(){});
    }catch(e){}
  }

  window.addEventListener("pagehide", function(){
    if(syncTimer){ clearTimeout(syncTimer); cloudBackup(); }
  });

  /* ------------------------------------------------------------------ */
  /* session rollover + starting-weight projection                       */
  /* ------------------------------------------------------------------ */

  function isLoggedSet(s){
    return !!s &&
      typeof s.weight === "number" && s.weight > 0 &&
      typeof s.reps === "number" && s.reps > 0;
  }

  // Archive whatever was logged on the previous calendar day into history and
  // clear the working sets, so "today" always starts empty.
  function rolloverSessions(){
    var today = todayKey();
    var previous = state.lastActiveDate;
    if(previous === today) return false;

    state.exercises.forEach(function(ex){
      normalizeExercise(ex);
      var logged = ex.sets.filter(isLoggedSet);
      if(previous && logged.length > 0){
        ex.history.push({
          date: previous,
          sets: logged.map(function(s){ return { weight: s.weight, reps: s.reps }; })
        });
        if(ex.history.length > MAX_HISTORY){
          ex.history = ex.history.slice(-MAX_HISTORY);
        }
      }
      ex.sets = [];
      ex._justPR = false;
      // Clear the marker too, so the new session lays its sets out again
      // rather than opening empty.
      ex.prefilledOn = null;
    });

    state.lastActiveDate = today;
    return true;
  }

  // Open a day and the sets are already laid out at the projected weight, so the
  // only thing left to type is reps. Runs at most once per exercise per day, so
  // deleting a set does not make it reappear.
  function prefillSets(ex){
    var want = ex.targetSets || 0;
    if(want <= 0) return false;
    var today = todayKey();
    if(ex.prefilledOn === today) return false;
    if(ex.sets.length > 0){ ex.prefilledOn = today; return false; }

    // One weight for the whole session, taken from the last real session.
    var weight = startingWeight(ex);
    for(var i = 0; i < want; i++) ex.sets.push({ weight: weight, reps: null });
    ex.prefilledOn = today;
    return true;
  }

  function lastLoggedSet(ex){
    for(var i = ex.sets.length - 1; i >= 0; i--){
      if(isLoggedSet(ex.sets[i])) return ex.sets[i];
    }
    return null;
  }

  // Last working set of the last *actual* session, read from history —
  // not whatever number happens to be sitting in an input field.
  function lastSessionWorkingSet(ex){
    if(!Array.isArray(ex.history)) return null;
    for(var i = ex.history.length - 1; i >= 0; i--){
      var session = ex.history[i];
      if(!session || !Array.isArray(session.sets)) continue;
      for(var j = session.sets.length - 1; j >= 0; j--){
        if(isLoggedSet(session.sets[j])){
          return { weight: session.sets[j].weight, reps: session.sets[j].reps, date: session.date };
        }
      }
    }
    return null;
  }

  function startingWeight(ex){
    var s = lastSessionWorkingSet(ex);
    if(!s) return null;
    return dapre(s.weight, s.reps);
  }

  // The weight this session is being worked at. Adding a set mid-workout must
  // reuse it, never re-run DAPRE -- doing that walked the load up 5 lb after
  // every logged set (90 -> 95 -> 100) and corrupted the session.
  function sessionWeight(ex){
    for(var i = ex.sets.length - 1; i >= 0; i--){
      if(ex.sets[i] && typeof ex.sets[i].weight === "number") return ex.sets[i].weight;
    }
    return startingWeight(ex);   // nothing logged yet: open at the projection
  }

  // Projection for the NEXT session, from the last set logged in this one.
  // Never used to fill a set in the current session.
  function suggestedWeight(ex){
    var last = lastLoggedSet(ex);
    if(last) return dapre(last.weight, last.reps);
    return startingWeight(ex);
  }

  /* ------------------------------------------------------------------ */
  /* partner (read-only) view                                            */
  /* ------------------------------------------------------------------ */

  var viewMode = "self";        // "self" | "partner"
  var partnerState = null;
  var partnerStatus = "idle";   // idle | loading | ok | empty | error
  var partnerUpdatedAt = null;

  function isReadOnly(){ return viewMode === "partner"; }

  function activeExercises(){
    if(viewMode === "partner"){
      return (partnerState && Array.isArray(partnerState.exercises)) ? partnerState.exercises : [];
    }
    return state.exercises;
  }

  function loadPartner(){
    if(!PARTNER) return;
    partnerStatus = "loading";
    render();
    fetch(PARTNER.url, { cache: "no-store" })
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(body){
        var incoming = (body && body.state) ? body.state : body;
        partnerUpdatedAt = (body && body.updatedAt) || null;
        if(!incoming || !Array.isArray(incoming.exercises) || incoming.exercises.length === 0){
          partnerState = null;
          partnerStatus = "empty";
        } else {
          incoming.exercises.forEach(normalizeExercise);
          partnerState = incoming;
          partnerStatus = "ok";
        }
        render();
      })
      .catch(function(err){
        partnerState = null;
        partnerStatus = "error";
        partnerUpdatedAt = null;
        render();
      });
  }

  function togglePartner(){
    if(!PARTNER) return;
    if(viewMode === "partner"){
      viewMode = "self";
      render();
      return;
    }
    viewMode = "partner";
    if(partnerState) render();
    else loadPartner();
  }

  /* ------------------------------------------------------------------ */
  /* rendering                                                           */
  /* ------------------------------------------------------------------ */

  var listEl = document.getElementById("exerciseList");
  var bannerEl = document.getElementById("partnerBanner");
  var addRowEl = document.querySelector(".add-exercise");
  var partnerBtn = document.getElementById("partnerToggle");

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str === null || str === undefined ? "" : str;
    return div.innerHTML;
  }

  function renderTabs(){
    var container = document.getElementById("tabsContainer");
    container.innerHTML = "";
    SEED_DAYS.forEach(function(day, idx){
      var btn = document.createElement("button");
      btn.className = "tab-btn" + (idx === currentDayIdx ? " active" : "");
      btn.innerHTML = escapeHtml(day.label) +
        '<span class="tab-focus">' + escapeHtml(day.focus || "") + '</span>';
      btn.setAttribute("data-idx", idx);
      btn.addEventListener("click", function(){
        currentDayIdx = idx;
        renderTabs();
        renderExercises();
      });
      container.appendChild(btn);
    });
  }

  function renderChrome(){
    if(partnerBtn){
      partnerBtn.textContent = viewMode === "partner"
        ? "← Back to My Log"
        : "View " + PARTNER.label + " →";
      partnerBtn.classList.toggle("is-active", viewMode === "partner");
    }
    if(addRowEl){
      addRowEl.style.display = isReadOnly() ? "none" : "";
    }
    if(bannerEl){
      if(!PARTNER || viewMode !== "partner"){
        bannerEl.style.display = "none";
        bannerEl.innerHTML = "";
      } else {
        bannerEl.style.display = "";
        var note = "";
        if(partnerStatus === "loading") note = "Loading…";
        else if(partnerStatus === "error") note = "Could not reach " + PARTNER.label + "'s log.";
        else if(partnerStatus === "empty") note = "No cloud data yet — " + PARTNER.label + " needs to open her app and log once.";
        else if(partnerStatus === "ok" && partnerUpdatedAt) note = "Last synced " + escapeHtml(new Date(partnerUpdatedAt).toLocaleString());
        bannerEl.innerHTML = "<strong>Read-only:</strong> " + escapeHtml(PARTNER.label) + "'s log. " + note;
      }
    }
  }

  function renderExercises(){
    listEl.innerHTML = "";
    var dayName = SEED_DAYS[currentDayIdx].dayName;
    var readOnly = isReadOnly();
    var dayExercises = activeExercises().filter(function(ex){ return ex.dayName === dayName; });

    if(dayExercises.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      if(readOnly){
        var msg = partnerStatus === "loading" ? "Loading her log…"
          : partnerStatus === "error" ? "Could not reach her log. Try again in a moment."
          : partnerStatus === "empty" ? "She has not synced any data yet."
          : "Nothing logged for this day.";
        empty.innerHTML = "<strong>" + escapeHtml(PARTNER.label) + "'s log</strong>" + escapeHtml(msg);
      } else {
        empty.innerHTML = "<strong>No exercises for this day</strong>Add one above to start logging sets.";
      }
      listEl.appendChild(empty);
      return;
    }

    if(!readOnly){
      var filled = false;
      dayExercises.forEach(function(ex){ if(prefillSets(ex)) filled = true; });
      if(filled) save();
    }

    dayExercises.forEach(function(ex){
      listEl.appendChild(renderExercise(ex, readOnly));
    });
  }

  function renderExercise(ex, readOnly){
    var card = document.createElement("div");
    card.className = "exercise";

    var best1RM = bestE1RM(ex.sets);
    var justHitPR = ex._justPR === true && !readOnly;

    var head = document.createElement("div");
    head.className = "exercise-head";
    head.innerHTML =
      '<div class="exercise-head-left">' +
        '<div class="plate' + (justHitPR ? ' is-pr' : '') + '">' +
          '<div class="num">' + (best1RM > 0 ? Math.round(best1RM) : "—") + '</div>' +
          '<div class="lbl">1RM</div>' +
        '</div>' +
        '<div>' +
          '<div class="exercise-name">' + escapeHtml(ex.name) + '</div>' +
          (ex.target ? '<div class="exercise-target">Target: ' + escapeHtml(ex.target) + '</div>' : '') +
        '</div>' +
      '</div>' +
      (readOnly ? '' : '<button class="btn-ghost btn-danger" data-action="delete-exercise" data-id="' + escapeHtml(ex.id) + '">Remove</button>');
    card.appendChild(head);

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    thead.innerHTML = '<tr><th>Set</th><th>Weight</th><th>Reps</th><th>Est. 1RM</th>' + (readOnly ? '' : '<th></th>') + '</tr>';
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    ex.sets.forEach(function(set, idx){
      var tr = document.createElement("tr");
      var e1rm = epley1RM(set.weight, set.reps);
      tr.innerHTML =
        '<td class="set-num">' + (idx + 1) + '</td>' +
        '<td><input class="cell-input" type="number" inputmode="decimal" step="5" min="0" ' +
            (readOnly ? 'disabled ' : '') +
            'value="' + (set.weight !== null && set.weight !== undefined ? set.weight : "") + '" ' +
            'data-action="set-weight" data-id="' + escapeHtml(ex.id) + '" data-idx="' + idx + '"></td>' +

  function normalizeNutrition(data){
    if(!data.nutrition || typeof data.nutrition !== "object") data.nutrition = {};
    var n = data.nutrition;
    if(!Array.isArray(n.entries)) n.entries = [];
    if(!n.targets || typeof n.targets !== "object") n.targets = {};
    Object.keys(DEFAULT_TARGETS).forEach(function(k){
      if(typeof n.targets[k] !== "number" || !isFinite(n.targets[k])){
        n.targets[k] = DEFAULT_TARGETS[k];
      }
    });
    return data;
  }

  // Calories track the macros unless the entry carries an explicit override.
  function entryCalories(e){
    if(e.caloriesManual && typeof e.calories === "number") return e.calories;
    return macroCalories(e.protein, e.carbs, e.fat);
  }

  function macroCalories(p, c, f){
    return Math.round((num(p) * 4) + (num(c) * 4) + (num(f) * 9));
  }

  function num(v){
    var n = typeof v === "number" ? v : parseFloat(v);
    return isFinite(n) && n > 0 ? n : 0;
  }

  var nutDate = todayKey();
  var calorieOverride = false;

  function entriesFor(dateKey){
    return state.nutrition.entries.filter(function(e){ return e.date === dateKey; });
  }

  function dayTotals(dateKey){
    var t = { protein:0, carbs:0, fat:0, calories:0 };
    entriesFor(dateKey).forEach(function(e){
      t.protein  += num(e.protein);
      t.carbs    += num(e.carbs);
      t.fat      += num(e.fat);
      t.calories += entryCalories(e);
    });
    return t;
  }

  function shiftDate(dateKey, days){
    var p = dateKey.split("-");
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    d.setDate(d.getDate() + days);
    return dateKey_(d);
  }

  function dateKey_(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
  }

  function longDate(key){
    var p = key.split("-");
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return days[d.getDay()] + ", " + mons[d.getMonth()] + " " + d.getDate();
  }

  function renderMacroRow(label, total, min, max, unit){
    var pct = max > 0 ? Math.min(100, (total / max) * 100) : 0;
    var cls = total > max ? "over" : (total >= min ? "good" : "under");
    var range = (min === max) ? String(min) : (min + "\u2013" + max);
    var note;
    if(total > max) note = "Over by " + Math.round(total - max) + unit;
    else if(total >= min) note = "In range";
    else note = Math.round(min - total) + unit + " to go";
    var zone = (max > 0 && min !== max) ? Math.min(100, (min / max) * 100) : -1;
    return '<div class="macro-row">' +
      '<div class="macro-head">' +
        '<span class="macro-name">' + escapeHtml(label) + '</span>' +
        '<span class="macro-val"><b>' + Math.round(total) + '</b> / ' + escapeHtml(range) + unit + '</span>' +
      '</div>' +
      '<div class="macro-track">' +
        '<div class="macro-fill ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div>' +
        (zone >= 0 ? '<div class="macro-zone" style="left:' + zone.toFixed(1) + '%"></div>' : '') +
      '</div>' +
      '<div class="macro-note">' + escapeHtml(note) + '</div>' +
    '</div>';
  }

  function renderNutrition(){
    if(!NUTRITION) return;
    var t = state.nutrition.targets;
    var totals = dayTotals(nutDate);

    document.getElementById("nutDateMain").textContent = longDate(nutDate);
    document.getElementById("nutDateSub").textContent =
      nutDate === todayKey() ? "Today" : nutDate;

    document.getElementById("nutSummary").innerHTML =
      renderMacroRow("Calories", totals.calories, t.caloriesMin, t.caloriesMax, "") +
      renderMacroRow("Protein",  totals.protein,  t.proteinMin,  t.proteinMax,  "g") +
      renderMacroRow("Carbs",    totals.carbs,    t.carbsMin,    t.carbsMax,    "g") +
      renderMacroRow("Fat",      totals.fat,      t.fatMin,      t.fatMax,      "g");

    var listEl2 = document.getElementById("nutEntries");
    var rows = entriesFor(nutDate);
    if(rows.length === 0){
      listEl2.innerHTML = '<div class="empty"><strong>Nothing logged yet</strong>Add your first entry above.</div>';
      return;
    }

    var html = "";
    MEALS.forEach(function(meal){
      var group = rows.filter(function(e){ return e.meal === meal; });
      if(group.length === 0) return;
      group.sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
      html += '<div class="meal-group"><div class="meal-title">' + escapeHtml(meal) + '</div>';
      group.forEach(function(e){
        html += '<div class="entry">' +
          '<div class="entry-main">' +
            '<div class="entry-food">' + escapeHtml(e.food || "\u2014") + '</div>' +
            '<div class="entry-meta">' +
              (e.time ? escapeHtml(e.time) + " \u00b7 " : "") +
              "P " + Math.round(num(e.protein)) + "g \u00b7 " +
              "C " + Math.round(num(e.carbs)) + "g \u00b7 " +
              "F " + Math.round(num(e.fat)) + "g" +
              (e.caloriesManual ? " \u00b7 manual kcal" : "") +
            '</div>' +
          '</div>' +
          '<div class="entry-cal">' + entryCalories(e) + '</div>' +
          '<button class="entry-del" data-nut-del="' + escapeHtml(e.id) + '" aria-label="Delete entry">\u2715</button>' +
        '</div>';
      });
      html += '</div>';
    });
    listEl2.innerHTML = html;
  }

  function renderTargetsForm(){
    var t = state.nutrition.targets;
    document.getElementById("nutTargetsForm").innerHTML =
      TARGET_FIELDS.map(function(f){
        return '<div class="row">' +
          '<div><label for="tgt-' + f.key + '-min">' + escapeHtml(f.label) + ' min</label>' +

          if(isFinite(v) && v >= 0) state.nutrition.targets[f.key + side] = v;
        });
        // A max below the min is almost certainly a typo -- clamp rather than
        // render an impossible range.
        var mn = state.nutrition.targets[f.key + "Min"];
        var mx = state.nutrition.targets[f.key + "Max"];
        if(mx < mn) state.nutrition.targets[f.key + "Max"] = mn;
      });
      save();
      renderTargetsForm();
      renderNutrition();

  var PUSH_PUBLIC_KEY = "BIaeBUon_uhg6-8qg013x6J9lp7XF-_bS-FRNQ4bgBYMJg8xjwDGcPQ5bfBNsZVt4YKK7Jr8VCgbUWsbR7Pa_ZY";

  function urlBase64ToUint8Array(base64String){
    var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(base64);
    var out = new Uint8Array(raw.length);
    for(var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function pushSupported(){
    return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  }

  // iOS only allows web push once the site is installed to the Home Screen.
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isStandalone(){
    return window.navigator.standalone === true ||
           (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function remEl(id){ return document.getElementById(id); }

  function setStatus(id, msg, cls){
    var el = remEl(id);
    if(!el) return;
    el.textContent = msg;
    el.className = "rem-status" + (cls ? " " + cls : "");
  }

  function localTimezone(){
    try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }catch(e){ return "UTC"; }
  }

  function prettyDate(iso){
    if(!iso) return "";
    var p = String(iso).split("-");
    if(p.length !== 3) return iso;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return mons[d.getMonth()] + " " + d.getDate();
  }

  // A single gate for both reminder kinds: is push usable on this device at all?
  function pushBlockedReason(){
    if(!pushSupported()) return "This browser can't do notifications.";
    if(isIOS() && !isStandalone()) return "Add to Home Screen first \u2014 see below.";
    return null;
  }

  function showRemNote(){

  function applySettings(s){
    if(!s) return;
    if(MEAL_REMINDERS && remEl("remMeals")){
      if(s.meals && s.meals.enabled && s.hasSubscription){
        setStatus("remMealStatus", "On \u2014 " + s.meals.times.join(", "), "good");

      } else {

        remEl("remMealOn").textContent = "Turn On Meal Reminders";
        remEl("remMealOff").setAttribute("hidden", "");
      }
    }
    if(remEl("remScan")){
      if(s.scan && s.scan.enabled && s.hasSubscription){
        setStatus("remScanStatus", "On \u2014 next " + prettyDate(s.scan.nextDate) +
          ", then every " + (s.scan.intervalDays / 7) + " weeks", "good");
        remEl("remScanOn").textContent = "Update Scan Reminder";

  function refreshReminderUI(){
    if(!remEl("reminders")) return;
    showRemNote();

    var blocked = pushBlockedReason();
    if(blocked){
      if(MEAL_REMINDERS) { setStatus("remMealStatus", blocked, "bad"); remEl("remMealOn").disabled = true; }
      setStatus("remScanStatus", blocked, "bad");
      remEl("remScanOn").disabled = true;
      return;
    }

    fetch(PUSH_URL, { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(applySettings)
      .catch(function(){
        if(MEAL_REMINDERS) setStatus("remMealStatus", "Couldn't reach the reminder service.");
        setStatus("remScanStatus", "Couldn't reach the reminder service.");
      });
  }

  // Registers the worker, asks permission once, and returns a subscription.
  function ensureSubscription(){
    return navigator.serviceWorker.register("/sw.js")
      .then(function(){ return navigator.serviceWorker.ready; })
      .then(function(reg){
        return Notification.requestPermission().then(function(perm){
          if(perm !== "granted") throw new Error("Notifications were blocked. Allow them in your browser settings.");
          return reg.pushManager.getSubscription().then(function(existing){
            if(existing) return existing;
            return reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(PUSH_PUBLIC_KEY)
            });
          });
        });
      })
      .then(function(sub){ return sub.toJSON ? sub.toJSON() : sub; });
  }

  function postSettings(body){
    return fetch(PUSH_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      if(!r.ok) return r.json().then(function(b){ throw new Error(b.error || ("HTTP " + r.status)); });
      return r.json();
    });
  }

  function enableMeals(){

      setStatus("remMealStatus", "Set all three times first.", "bad");
      return;
    }
    setStatus("remMealStatus", "Setting up\u2026");
    ensureSubscription()
      .then(function(sub){
        return postSettings({ subscription: sub, timezone: localTimezone(),
                              meals: { enabled: true, times: times } });
      })
      .then(function(s){ applySettings(s); toast("Meal reminders on"); })
      .catch(function(err){ setStatus("remMealStatus", err.message || "Could not turn on reminders.", "bad"); });
  }

  function enableScan(){
    var date = remEl("remScanDate").value;
    if(!date){ setStatus("remScanStatus", "Pick a date first.", "bad"); return; }
    setStatus("remScanStatus", "Setting up\u2026");
    ensureSubscription()
      .then(function(sub){
        return postSettings({ subscription: sub, timezone: localTimezone(),
          scan: { enabled: true, nextDate: date,
                  time: remEl("remScanTime").value || "07:30",
                  intervalDays: Number(remEl("remScanEvery").value) } });

  // subscription once nothing at all is enabled.
  function disableKind(kind, statusId){
    var body = {};
    body[kind] = { enabled: false };
    setStatus(statusId, "Turning off\u2026");

      .then(function(s){
        applySettings(s);
        toast("Reminder off");
        if(!s.hasSubscription && pushSupported()){
          navigator.serviceWorker.ready
            .then(function(reg){ return reg.pushManager.getSubscription(); })
            .then(function(sub){ return sub ? sub.unsubscribe() : null; })
            .catch(function(){});
        }
      })
      .catch(function(){ setStatus(statusId, "Could not turn it off.", "bad"); });
  }

  function wireReminders(){
    if(!remEl("reminders")) return;
    if(MEAL_REMINDERS && remEl("remMealOn")){
      remEl("remMealOn").addEventListener("click", enableMeals);
      remEl("remMealOff").addEventListener("click", function(){ disableKind("meals", "remMealStatus"); });
    }
    remEl("remScanOn").addEventListener("click", enableScan);
    remEl("remScanOff").addEventListener("click", function(){ disableKind("scan", "remScanStatus"); });
    refreshReminderUI();
  }

  // Work worth protecting: a logged set, an archived session, or (Nick only) a
  // nutrition entry. A freshly seeded program counts as empty.
  function countWork(st){
    if(!st || typeof st !== "object") return 0;
    var n = 0;
    (st.exercises || []).forEach(function(ex){
      (ex.sets || []).forEach(function(s){ if(isLoggedSet(s)) n++; });
      // Imported starting weights are a cold-start floor, not logged work.
      // Counting them would make a fresh install look non-empty and block
      // the cloud restore that should bring the real history back.
      (ex.history || []).forEach(function(h){
        if(h && !h.imported) n += (h.sets || []).length;
      });
    });
    if(st.nutrition && st.nutrition.entries) n += st.nutrition.entries.length;
    return n;
  }

  // Pull the cloud copy whenever it is newer than this device's. That covers a
  // cleared browser or a new phone, and -- because both apps write to the same
  // per-person record -- sets logged on your behalf from the other app.
  var pullInFlight = false;

  function syncFromCloud(onDone){
    try{
      if(typeof fetch !== "function" || pullInFlight) return;
      pullInFlight = true;

      fetch(SYNC_URL, { cache: "no-store" })
        .then(function(res){ return res.ok ? res.json() : null; })
        .then(function(body){
          var incoming = body && body.state ? body.state : null;
          if(!incoming) return;

          var remoteWork = countWork(incoming);
          if(remoteWork === 0) return;              // nothing worth adopting

          var remoteAt = incoming.updatedAt || body.updatedAt || null;
          var localAt = state.updatedAt || null;
          var adopt = countWork(state) === 0 ||     // this device has nothing
                      !localAt ||                    // never stamped locally
                      (remoteAt && remoteAt > localAt);
          if(!adopt) return;

          var next = normalizeState(incoming);
          if(!next) return;

          state = next;
          persistLocal();          // adopt as-is; restamping would bounce it back
          renderTabs();
          render();
          if(onDone) onDone(remoteWork);
        })
        .catch(function(){})
        .then(function(){ pullInFlight = false; });
    }catch(e){ pullInFlight = false; }
  }

  /* ------------------------------------------------------------------ */
  /* wiring                                                              */
  /* ------------------------------------------------------------------ */

  document.getElementById("addExerciseBtn").addEventListener("click", function(){
    var input = document.getElementById("newExerciseInput");
    addExercise(input.value);
    input.value = "";
    input.focus();
  });

  document.getElementById("newExerciseInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      addExercise(this.value);
      this.value = "";
    }
  });

  listEl.addEventListener("click", function(e){
    if(isReadOnly()) return;
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if(action === "delete-exercise"){
      if(confirm("Remove this exercise and all its logged sets?")) deleteExercise(id);
    } else if(action === "add-set"){
      addSet(id);
    } else if(action === "delete-set"){
      deleteSet(id, parseInt(el.getAttribute("data-idx"), 10));
    }
  });

  listEl.addEventListener("change", function(e){
    if(isReadOnly()) return;
    var el = e.target;
    var action = el.getAttribute("data-action");
    if(action === "set-weight" || action === "set-reps"){
      var id = el.getAttribute("data-id");
      var idx = parseInt(el.getAttribute("data-idx"), 10);
      var field = action === "set-weight" ? "weight" : "reps";
      updateSetField(id, idx, field, el.value);
    }
  });

  if(partnerBtn){
    partnerBtn.addEventListener("click", togglePartner);
  }

  function checkRollover(){
    if(rolloverSessions()){
      currentDayIdx = getTodayIndex();
      save();
      renderTabs();
      render();
    }
  }

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) return;
    checkRollover();
    syncFromCloud(function(n){ toast("Synced " + n + " entries from your other device"); });
  });

  // Roll yesterday's work into history before the first paint, and persist a
  // program migration so it survives the session and reaches the cloud backup.
  if(rolloverSessions() || programMigrated) save();

  wireNutrition();
  wireReminders();
  renderTabs();
  render();
  syncFromCloud();
})();
</script>

</body>
</html>
