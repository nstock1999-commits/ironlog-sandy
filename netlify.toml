[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# reminders.mjs is a v2 function and declares its own schedule inline, so no
# [functions."reminders"] block here. v1 handlers never receive the Netlify
# Blobs context on a scheduled run; v2 does.

# An installed PWA will happily serve a cached index.html for days, which means
# a shipped fix silently does not reach the phone. Force revalidation on the
# entry point and the service worker; hashed assets are unaffected.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# API routes must come BEFORE the SPA catch-all below, or /* swallows them.
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
