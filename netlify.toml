[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# Meal reminders. Netlify's cron is UTC, so this runs every 15 minutes and the
# function decides what is due in each person's own timezone.
[functions."reminders"]
  schedule = "*/15 * * * *"

# API routes must come BEFORE the SPA catch-all below, or /* swallows them.
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
